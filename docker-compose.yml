name: treino-do-dia

services:
  # Banco de dados do app (MySQL 8.4 LTS). Schema em db/init/*.sql.
  # Persistência no volume nomeado "mysql-data"; a porta do host é DB_PORT
  # (padrão 3307, pois 3306 costuma estar ocupada por outros MySQL locais).
  db:
    build: ./db
    image: treino-do-dia-db:latest
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-treino}
      MYSQL_USER: ${MYSQL_USER:-treino}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-treino_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      TZ: UTC
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Sem credenciais: mysqladmin ping só verifica se o servidor responde.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # App: http://localhost:${APP_PORT:-3000}
  app:
    build: .
    image: treino-do-dia:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      # Padrão: o mock abaixo (rede interna do compose). Para a API real:
      #   APP_EXERCISES_API_URL=https://gymapi.kadu.tec.br/api/v1 docker compose up -d app
      EXERCISES_API_URL: ${APP_EXERCISES_API_URL:-http://mock:3055/api/v1}
      EXERCISES_API_SEARCH_PARAM: ${EXERCISES_API_SEARCH_PARAM:-Search}
      EXERCISES_API_AUTH_HEADER: ${EXERCISES_API_AUTH_HEADER:-}
      EXERCISES_API_AUTH_VALUE: ${EXERCISES_API_AUTH_VALUE:-}
      EXERCISES_API_TIMEOUT_MS: ${EXERCISES_API_TIMEOUT_MS:-5000}
      EXERCISES_API_CACHE_TTL_MS: ${EXERCISES_API_CACHE_TTL_MS:-60000}
      EXERCISES_API_CONCURRENCY: ${EXERCISES_API_CONCURRENCY:-6}
      # Banco de dados: os treinos são persistidos no MySQL.
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-treino}
      MYSQL_USER: ${MYSQL_USER:-treino}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-treino_dev}
      # Usuário dono dos treinos enquanto não há login (seed do banco).
      DEFAULT_USER_ID: ${DEFAULT_USER_ID:-1}

  # Mock da API de exercícios — só para desenvolvimento/demonstração.
  # Usa a mesma imagem, trocando o comando. Não é exposto no host.
  mock:
    build: .
    image: treino-do-dia:latest
    restart: unless-stopped
    command: ["node", "mock-api/server.js"]
    environment:
      MOCK_API_PORT: 3055
      MOCK_API_LATENCY_MS: ${MOCK_API_LATENCY_MS:-0}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3055/api/v1/muscles/groups').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mysql-data:
